[package]
name = "floppy-behavior"
description = "The `behavior` namespace: `<behavior:instances_from_behavior_results>`, `<behavior:replace_behavior_clauses>`, `<behavior:lifetime_errors>`, `<behavior:verify_tick>`, `<behavior:verify_apply>` and `<behavior:turn_program>`, the original's behavior package (its storage rows and clauses, a lifetime's schedule bounds, the forced tick's and the live turn's checks, and a turn behavior's one program shape, whose template it carries), as a Wasm extension component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SCXML a lifetime check reads, with the XML parser scxml.rs's syntax
# crate uses (the same pin; no I/O).
quick-xml.workspace = true
# The rows, statements and diagnostics as JSON (no schema code, so no
# randomness).
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
