[package]
name = "floppy-conversation"
description = "The `conversation` namespace: the conversation's and its turn detector's bookkeeping (`<conversation:message_for_turn>`, `<conversation:relationship_for_input>`, `<conversation:participant_for_source>`, `<conversation:fail_turn>`, `<conversation:detector_refs>`, `<conversation:new_track_ref>`, `<conversation:content_for_detector>`, `<conversation:complete_turn>`, `<conversation:ingest_content>`, `<conversation:on_end>`, and the people of long-term memory: `<conversation:people_for_input>`, `<conversation:fold_voices>`, `<conversation:people_to_merge>`, `<conversation:merged_context_refs>`), as a Wasm extension component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The data values the data model reads and assigns, and the JSON of the
# message, its identities and provenance (no schema code, so no randomness).
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
