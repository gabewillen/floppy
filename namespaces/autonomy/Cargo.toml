[package]
name = "floppy-autonomy"
description = "The `autonomy` namespace: `<autonomy:behavior_input_payload>` (the input a learned behavior runs with) as a Wasm extension component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The stimulus data and the payload as JSON (no schema code, so no
# randomness).
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
