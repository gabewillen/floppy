[package]
name = "floppy-decision"
description = "The `decision` namespace: `<decision:menu>`, the canonical menu of the enabled transitions and their event schemas (the synchronous half of a decision), as a Wasm extension component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical JSON (the menu document), the digest check of the snapshot's
# event schemas, and the compile check of each offered schema
# (`CompiledSchema`; boon, nothing ever loaded).
scxml-event-schema.workspace = true
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
