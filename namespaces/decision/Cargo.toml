[package]
name = "nemobot-decision"
description = "The `decision` namespace: ranked choice among enabled transitions, filled and validated against their event schemas, as a Wasm extension component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical JSON (deterministic request bodies), the digest check of the
# snapshot's event schemas, and the JSON Schema checks of filled event data
# (`resolve` for explicit candidates, `CompiledSchema` for every schema;
# boon, nothing ever loaded).
scxml-event-schema.workspace = true
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
