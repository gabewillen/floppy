[package]
name = "scx"
description = "The `scx` namespace: SCXML authoring tools (`<scx:validate>`, the scxml.rs validator in one extension element) as a Wasm extension component that `scx` embeds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The validator itself, linked in (no I/O): parsing, the bundled W3C XSD set,
# semantic rules, and the `event:schema` checks.
scxml-event-schema.workspace = true
scxml-reporting.workspace = true
scxml-syntax.workspace = true
scxml-types.workspace = true
scxml-validator-core.workspace = true
scxml-validator-xsd.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
