[package]
name = "floppy-cognition"
description = "The `cognition` namespace: `<cognition:attention_bias_for_turn>` and `<cognition:model_facing_content>` (the turn's attention bias and the model-facing projection of a turn's input) as a Wasm extension component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The focus candidates and the projected values as JSON (no schema code,
# so no randomness).
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
