[package]
name = "floppy-service-sql"
description = "The `sql` invoked service: one SQLite transaction of parameterized statements per `<invoke>` against a database file in a directory the run grants, as a Wasm component whose `invoke` export is an `async func`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# SQLite itself (the amalgamation, compiled in): on wasm32-wasip2 with the
# pinned wasi-sdk (`WASI_SDK_PATH`, scripts/build-components.sh), where
# SQLite's own `__wasi__` port reaches the granted directory through
# `wasi:filesystem`.
rusqlite = { workspace = true }
# Canonical JSON of the returned event data.
scxml-event-schema.workspace = true
scxml-types.workspace = true
serde_json.workspace = true
# The WASI 0.3 async ABI: `invoke` is an `async func`.
wit-bindgen = { workspace = true, features = ["async", "async-spawn"] }

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
