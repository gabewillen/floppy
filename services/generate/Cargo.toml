[package]
name = "nemobot-service-generate"
description = "The `generate` invoked service: one provider-neutral model generation (text or schema-validated structured output) per `<invoke>`, as a Wasm component that never blocks the session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical JSON (deterministic request bodies) and the JSON Schema checks of
# structured output: `resolve` (metaschema, no external references) and
# `CompiledSchema` (boon, nothing ever loaded).
scxml-event-schema.workspace = true
scxml-types.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
