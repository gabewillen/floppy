[package]
name = "floppy-service-generate"
description = "The `generate` invoked service: one provider-neutral model generation (text or schema-validated structured output) per `<invoke>`, as a Wasm component whose `invoke` export is an `async func`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical JSON (deterministic request bodies) and the JSON Schema checks of
# structured output: `resolve` (metaschema, no external references) and
# `CompiledSchema` (boon, nothing ever loaded).
scxml-event-schema.workspace = true
scxml-types.workspace = true
serde_json.workspace = true
# The WASI 0.3 async ABI: `invoke` is an `async func`.
wit-bindgen = { workspace = true, features = ["async", "async-spawn"] }

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
