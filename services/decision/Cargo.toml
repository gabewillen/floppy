[package]
name = "floppy-service-decision"
description = "The `decision` invoked service: OpenAI Decisions API's question types (a `choice` of an event from a choice list, filled from grounded options and validated against its schema, or of a label; a `predicate` of every groundable event; a `score` of candidates), through a pluggable backend, as a Wasm component whose `invoke` export is an `async func`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical JSON (deterministic request bodies) and the JSON Schema checks of
# the choices' schemas and the filled event data (`resolve` for each choices
# schema, `CompiledSchema` to validate; boon, nothing ever loaded).
scxml-event-schema.workspace = true
scxml-types.workspace = true
serde_json.workspace = true
# The WASI 0.3 async ABI: `invoke` is an `async func`.
wit-bindgen = { workspace = true, features = ["async", "async-spawn"] }

[dev-dependencies]
# The package test reads the manifest with the parser every host uses.
scxml-validator-core.workspace = true

[lints]
workspace = true
