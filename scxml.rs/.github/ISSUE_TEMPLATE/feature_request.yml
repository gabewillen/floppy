name: Feature request
description: Propose a capability, host, component, or tooling change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project implements SCXML 1.0 as written. Behavior a document could observe beyond the specification belongs in an extension component (docs/executable-content-extensions.md), not the core.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, and which component, host, or WIT contract it touches.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Specification references
      description: SCXML 1.0 sections, W3C IRP cases, or other standards the proposal relies on, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
