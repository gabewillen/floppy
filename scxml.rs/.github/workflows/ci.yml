name: CI

on:
  push:
    branches: [main]
    # A version tag also publishes the GitHub release (job `release`) that
    # repository namespaces load their components from.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free runner disk space
        # component_execution.rs builds its own release into a second target
        # directory; the stock runner image leaves little room beside the
        # workspace build.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust toolchain installer
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-deny@0.20.2,wasm-tools@1.244.0
      # The IRP baselines bind the exact component bytes wasi-virt emits, and
      # several upstream commits report version 0.2.0, so pin the revision.
      - name: Install the pinned wasi-virt revision
        run: cargo install --locked --git https://github.com/bytecodealliance/WASI-Virt --rev 448f6df8f688cee5d6995e96b1ffc31f9bf00742 wasi-virt
      - run: cargo fmt --all --check
      # `scx` embeds the release session components (crates/scxml-cli/build.rs
      # reads target/wasm-artifacts/release), so they are built first.
      - run: sh scripts/verify-wasm-capabilities.sh
      # Every later test step reads its components from that one verified
      # release instead of building its own (CONTRIBUTING.md,
      # "SCXML_COMPONENTS_DIR"); component_execution.rs still builds its own.
      - name: Share the verified release with every test step
        run: |
          echo "SCXML_COMPONENTS_DIR=$PWD/target/wasm-artifacts/release" >> "$GITHUB_ENV"
          echo "SCXML_COMPONENTS_MANIFEST_SHA256=$(sha256sum target/wasm-artifacts/release/manifest.tsv | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - run: cargo check --workspace --all-targets --locked
      # The workspace's test binaries, whole binaries side by side.
      - run: python3 scripts/test-parallel.py
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked
      - run: cargo test -p scxml-wit --locked
      - run: cargo clippy --locked --target wasm32-wasip2 -p scxml-telemetry -p scxml-validator-xsd -p scxml-clock -p scxml-compiler -p scxml-data-model-ecmascript -p scxml-data-model-null -p scxml-data-model-xpath -p scxml-ioprocessor-scxml -p scxml-ioprocessor-basichttp -p scxml-machine -p scxml-extension-example -p scxml-package-validator-example -p scxml-reporter-rustc -p scxml-reporter-sarif -p scxml-script-example -p scxml-service-example -p scxml-service-files -p scxml-snapshot-codec -p scxml-validator -p scxml-resolver-github -p scx -- -D warnings
      - run: cargo check -p scxml-host-wasmtime --features wasmtime --locked
      - run: cargo test -p scxml-host-wasmtime --features wasmtime,http --locked
        timeout-minutes: 75
      - run: cargo deny check
      - name: Check IRP source-set digest documentation drift
        run: |
          for model in ecmascript xpath; do
            digest=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['suite']['source_digest'])" "tests/conformance/w3c-irp/prepared/$model/corpus.json")
            grep -qF "$digest" tests/conformance/w3c-irp/README.md || { echo "tests/conformance/w3c-irp/README.md does not publish $model source-set digest $digest"; exit 1; }
          done
      # Format versions (Machine IR, report payload, session snapshot document,
      # delayed-send wire) and the baseline, report, corpus, errata, source-set, and manifest
      # digests published in README.md, docs/conformance.md, CHANGELOG.md, and
      # tests/conformance/w3c-irp/README.md must equal the code and baselines,
      # and CONTRIBUTING.md must list every command and pin in this file.
      - name: Check published format-version and conformance-digest drift
        run: cargo test -p scxml-conformance --test published_contract_docs --locked
      # The path users run: every applicable official IRP document compiles
      # through `scx compile`, whose validator links the ECMAScript and
      # XPath expression checkers the conformance runner's compiler does not
      # (docs/conformance.md, "Validator-linked compile gate").
      - name: Compile every applicable official IRP case through the validator-linked CLI
        run: cargo test -p scxml-cli --test irp_validator_path --locked -- --nocapture

  wasm32-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust toolchain installer
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
      # The tests of the bounds that apply to wasm builds only run on wasm32
      # under the Wasmtime CLI, at the workspace's Wasmtime version.
      - run: cargo install --locked wasmtime-cli@49.0.2
      - run: sh scripts/test-wasm32.sh

  wasm-components:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust toolchain installer
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: wasm-tools@1.244.0
      # The IRP baselines bind the exact component bytes wasi-virt emits, and
      # several upstream commits report version 0.2.0, so pin the revision.
      - name: Install the pinned wasi-virt revision
        run: cargo install --locked --git https://github.com/bytecodealliance/WASI-Virt --rev 448f6df8f688cee5d6995e96b1ffc31f9bf00742 wasi-virt
      - run: python3 scripts/verify-component-authored-unsafe.py
      - run: sh scripts/verify-wasm-capabilities.sh
      - name: Prove release guest bytes are path-, target-, and CARGO_HOME-independent
        run: sh scripts/verify-reproducible-wasm.sh scxml-machine

  # The required conformance gate: both checked-in W3C IRP corpora run
  # through the shipped Wasm components under the Wasmtime session host (the
  # only execution path) and must reproduce the checked-in canonical
  # baselines byte for byte.
  irp-components:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/irp-components
      RELEASE: ${{ github.workspace }}/target/irp-components/wasm-artifacts/irp-components
      # The release `scx` embeds (crates/scxml-cli/build.rs).
      SCXML_WASM_ARTIFACTS_DIR: ${{ github.workspace }}/target/irp-components/wasm-artifacts/irp-components
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust toolchain installer
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: wasm-tools@1.244.0
      # The IRP baselines bind the exact component bytes wasi-virt emits, and
      # several upstream commits report version 0.2.0, so pin the revision.
      - name: Install the pinned wasi-virt revision
        run: cargo install --locked --git https://github.com/bytecodealliance/WASI-Virt --rev 448f6df8f688cee5d6995e96b1ffc31f9bf00742 wasi-virt
      # The eight components the conformance executor links, the
      # example extension component the namespace suites
      # (namespaces/<name>/irp) bind, and the scx namespace and GitHub
      # resolver components `scx` embeds with them.
      - name: Build and verify the release components
        run: |
          sh scripts/verify-wasm-capabilities.sh --artifacts-dir "$RELEASE" \
            scxml_clock scxml_data_model_ecmascript scxml_data_model_null scxml_data_model_xpath \
            scxml_ioprocessor_scxml scxml_ioprocessor_basichttp scxml_compiler scxml_machine \
            scxml_extension_example scxml_resolver_github scx
          echo "MANIFEST_SHA256=$(sha256sum "$RELEASE/manifest.tsv" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "EXTENSION_SHA256=$(sha256sum "$RELEASE/scxml_extension_example.virtualized.wasm" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      # The canonical release identity is this job's build (docs/conformance.md,
      # "Canonical release identity"): publish it so contributors on other
      # hosts can check identity bytes against it, with the license texts the
      # components are distributed under. None of these nine components
      # embeds W3C schema or test-suite material (README.md, "License").
      - name: Add the license texts to the release components
        run: cp LICENSE-APACHE LICENSE-MIT "$RELEASE/"
      - name: Upload the canonical release components
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-components
          path: ${{ env.RELEASE }}
          if-no-files-found: error
      - name: Run the conformance tests through the components
        run: |
          SCXML_COMPONENTS_DIR="$RELEASE" SCXML_COMPONENTS_MANIFEST_SHA256="$MANIFEST_SHA256" \
            SCXML_EXTENSION_COMPONENT_SHA256="$EXTENSION_SHA256" \
            cargo test --release --locked -p scxml-conformance --features wasmtime
      - name: Reproduce both canonical baselines through the CLI
        run: |
          cargo build --release --locked -p scxml-cli --features wasmtime
          for model in ecmascript xpath; do
            "$CARGO_TARGET_DIR/release/scx" conformance run \
              --corpus "tests/conformance/w3c-irp/prepared/$model" \
              --canonical-baseline "tests/conformance/w3c-irp/baselines/$model.scxml-report.json"
          done
      # Each repository namespace's own suite (docs/conformance.md,
      # "Namespace suites"), binding the example extension package where it
      # is used.
      - name: Reproduce every namespace suite's canonical baselines through the CLI
        run: |
          EXAMPLE_URI='https://stateforward.org/scxml/example'
          EXAMPLE_PACKAGE="--extension-package components/scxml-extension-example/package/example.extension.json --extension-component-sha256 $EXAMPLE_URI=$EXTENSION_SHA256"
          for suite in env:example event:; do
            name=${suite%%:*}
            packages=''
            if [ -n "${suite#*:}" ]; then packages=$EXAMPLE_PACKAGE; fi
            for model in ecmascript xpath; do
              "$CARGO_TARGET_DIR/release/scx" conformance run \
                --corpus "namespaces/$name/irp/prepared/$model" \
                --components "$RELEASE" --components-manifest-sha256 "$MANIFEST_SHA256" $packages \
                --canonical-baseline "namespaces/$name/irp/baselines/$model.scxml-report.json"
            done
          done
      # docs/session-snapshot.md, "Non-perturbation proof over the IRP":
      # snapshot collection is non-perturbing, every document is sound, and
      # two runs produce identical documents, over both prepared corpora.
      - name: Prove session-snapshot collection over both corpora
        run: |
          for model in ecmascript xpath; do
            "$CARGO_TARGET_DIR/release/scx" conformance run \
              --corpus "tests/conformance/w3c-irp/prepared/$model" \
              --snapshot-every-checkpoint \
              --canonical-baseline "tests/conformance/w3c-irp/baselines/$model.scxml-report.json"
          done
      # `scx snapshot run` end to end: the shared fixtures' checkpoint
      # documents, every failure exit, and the snapshot proof's gates; and
      # `scx run` live sessions (records, exits, signals, replay).
      - name: Run the snapshot and live CLI end to end through the components
        run: |
          SCXML_COMPONENTS_DIR="$RELEASE" SCXML_COMPONENTS_MANIFEST_SHA256="$MANIFEST_SHA256" \
            cargo test --release --locked -p scxml-cli --features wasmtime --test snapshot_run --test live_run

  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust toolchain installer
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: wasm-tools@1.244.0
      # The IRP baselines bind the exact component bytes wasi-virt emits, and
      # several upstream commits report version 0.2.0, so pin the revision.
      - name: Install the pinned wasi-virt revision
        run: cargo install --locked --git https://github.com/bytecodealliance/WASI-Virt --rev 448f6df8f688cee5d6995e96b1ffc31f9bf00742 wasi-virt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.11.1
      # Explicit, pinned install steps: the npm lockfile and the headless
      # Chromium revision pinned by playwright-core 1.62.0. The tests
      # themselves use no network (the e2e server binds 127.0.0.1).
      - name: Install pinned npm dependencies and headless Chromium
        working-directory: hosts/scxml-host-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright-core install --with-deps --only-shell chromium
      - run: sh scripts/verify-browser-host.sh

  # A version tag publishes the GitHub release a repository namespace's
  # URI (`https://github.com/<owner>/<repo>/namespaces/<name>@<tag>`) loads
  # its extension component from (docs/executable-content-extensions.md,
  # "Loading an element from a repository"): every release component, the
  # release manifest, and a SHA256SUMS file over them, which the loader
  # verifies the component against. Only after every other job passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, wasm32-tests, wasm-components, irp-components, browser-host]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE: ${{ github.workspace }}/target/wasm-artifacts/github-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust toolchain installer
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: wasm-tools@1.244.0
      # The IRP baselines bind the exact component bytes wasi-virt emits, and
      # several upstream commits report version 0.2.0, so pin the revision.
      - name: Install the pinned wasi-virt revision
        run: cargo install --locked --git https://github.com/bytecodealliance/WASI-Virt --rev 448f6df8f688cee5d6995e96b1ffc31f9bf00742 wasi-virt
      # Every namespace package names its tagless URI and this tag's
      # package version.
      - name: Check that every namespace package is this release
        run: sh scripts/check-namespace-versions.sh "$GITHUB_REF_NAME"
      - name: Build and verify every release component
        run: sh scripts/verify-wasm-capabilities.sh --artifacts-dir "$RELEASE"
      - name: Write SHA256SUMS over the release assets
        run: |
          cp LICENSE-APACHE LICENSE-MIT "$RELEASE/"
          cd "$RELEASE"
          sha256sum -- *.virtualized.wasm manifest.tsv > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RELEASE"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "Release components of $GITHUB_REF_NAME; verify downloads against SHA256SUMS." \
            -- *.virtualized.wasm manifest.tsv SHA256SUMS LICENSE-APACHE LICENSE-MIT
