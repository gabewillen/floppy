[package]
name = "scxml-service-example"
description = "Example invoked-service Wasm component: an echo and timer service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scxml-types.workspace = true
# The WASI 0.3 async ABI: `invoke` is an `async func`, and the service's
# tasks run on after it returns.
wit-bindgen = { workspace = true, features = ["async", "async-spawn"] }


[lints]
workspace = true
