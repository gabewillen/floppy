[package]
name = "scxml-resolver-github"
description = "Repository package resolver Wasm component: GitHub releases over WASI 0.3 wasi:http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scxml-types.workspace = true
serde_json.workspace = true
url.workspace = true
# The WASI 0.3 async ABI: `resolve` and `fetch` are `async func`s that await
# `wasi:http/client.send`.
wit-bindgen = { workspace = true, features = ["async"] }

[lints]
workspace = true
