<style>
/* Solid fills, no glows or translucency, so lines and text stay crisp. Layout: the Blueprint sheet from the floppy site. Top rule, then palette | drawing | run panel. Blocks are line drawings: a tinted fill and a stroke in their family's hue, so the notches read as interlocking outlines. Single look by choice. */
:root{
  --bg:#103766; --grid:rgba(214,232,255,.07); --grid2:rgba(214,232,255,.14); --ink:#e8f1ff; --mute:#b9cfec; --acc:#7fd0ff; --warn:#ffd27a;
  --panel:#103766; --well:#0a2447; --field:#061a35; --line:#e8f1ff; --dash:rgba(157,184,220,.45); --code:#0a2447; --hi:rgba(255,210,122,.22);
  --ok:#8ff0b0; --bad:#ff9a8f; --led:#ffffff;
  --c-root:#4a5d78; --c-state:#6a3fd1; --c-trans:#1f6fd1; --c-hook:#0e8a96; --c-invoke:#2e8b3a; --c-dm:#7a8b12;
  --c-exec:#c47a00; --c-flow:#c0392b; --c-ext:#c0287a; --c-param:#8a5a2b; --c-other:#5f6b7a; --edge:#061a35;
  --f-c:"Barlow Condensed","Arial Narrow",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --f-ui:var(--f-mono);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-mono);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
floppy-workshop{display:block;padding:0 16px 16px}
.top{min-width:0;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;padding-block:18px 12px;border-bottom:1.5px solid var(--ink);margin-bottom:14px}
.top h1{margin:0;font:600 30px/1 var(--f-c);letter-spacing:.04em;text-transform:uppercase}
.top h1 span{color:var(--acc)}
.top .doc{overflow-wrap:anywhere;min-width:0;font-size:12.5px;color:var(--mute)}
.top .chip{font-size:11.5px;color:var(--mute);border:1px dashed var(--dash);padding:3px 10px;background:var(--bg)}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr) 330px;gap:14px;min-height:calc(100vh - 90px)}
@media (max-width:1180px){floppy-workshop[data-mode] .grid{grid-template-columns:minmax(0,1fr)!important}}
.panel{background:var(--panel);border:1.5px solid var(--line);min-width:0}
.ph{padding:9px 12px;border-bottom:1.5px solid var(--line);font:600 14px var(--f-c);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}

/* palette */
floppy-palette{display:block}
.legend{padding:10px 12px;border-bottom:1px dashed var(--dash);display:grid;gap:6px}
.legend p{margin:0;font-size:11.5px;color:var(--mute);line-height:1.5}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legend li{display:flex;align-items:center;gap:8px;font-size:11.5px}
.legend svg{flex:0 0 auto;color:var(--acc)}
.cats{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px dashed var(--dash)}
.cats button{border:1px solid var(--mute);background:transparent;padding:2px 9px;font:600 13px var(--f-c);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;gap:12px;padding:10px 12px 16px;justify-items:start;overflow-x:auto}
.items .hint{font-size:11.5px;color:var(--mute);margin:0;line-height:1.5}
.items floppy-block{cursor:grab}

/* canvas */
floppy-canvas{display:block;border:1.5px solid var(--line);overflow:auto;position:relative;min-width:0;background:var(--well)}
floppy-canvas .pad{padding:22px 26px 80px;min-width:max-content}
.status{position:sticky;left:0;bottom:0;margin:0;padding:8px 12px;font-size:12px;background:var(--bg);border-top:1.5px solid var(--line);color:var(--mute);min-height:34px}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}

/* blocks */
floppy-block{display:block;position:relative;isolation:isolate;width:max-content;color:var(--ink);font-size:13px}
floppy-block>svg.shape{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none}
floppy-block>.hd{display:flex;align-items:center;gap:7px;padding:12px 12px 9px 14px;min-height:44px;white-space:nowrap;cursor:grab}
floppy-block>.hd .tag{font:700 19px/1 var(--f-c);letter-spacing:.06em;text-transform:uppercase;color:#fff}
floppy-block>.hd .tag i{font-style:normal}
floppy-block>.hd .tag .ico{display:inline-block;min-width:1.3em;margin-right:6px;font:700 15px/1 var(--f-mono);text-align:center}
floppy-workshop:not([data-show-details]) floppy-block>.hd .tag{text-transform:none;letter-spacing:.02em;font-size:20px}
.details{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:600 14px var(--f-c);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.details input{accent-color:var(--acc);width:16px;height:16px}
.top .details+floppy-modes{margin-left:0}
floppy-block>.hd label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.9)}
floppy-block>.hd input,floppy-block>.hd select{background:var(--field);color:var(--ink);border:0;border-bottom:1px solid var(--mute);border-radius:0;padding:3px 6px;font-family:var(--f-mono);font-size:13px;max-width:240px}
floppy-block>.hd select option{background:var(--bg);color:var(--ink)}
floppy-block>.hd .req-missing{border-bottom:1.5px dashed var(--bad);background:#3a2333}
floppy-block>.hd select.add{width:28px;height:24px;padding:0 4px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.85);appearance:none;text-align:center}
floppy-block>.hd .x{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;width:24px;height:24px;line-height:20px;font-size:14px;padding:0;margin-left:2px}
floppy-block>.mouth{margin-left:16px;min-height:30px;position:relative;transition:min-height .12s}
floppy-block>.mouth.empty{min-height:12px}
floppy-block.sel>.mouth.empty,floppy-block[data-state="offering"]>.mouth.empty{min-height:30px}
/* While a block is dragged, blocks that can take it keep their color and show their mouth; the rest dim. */
floppy-canvas[data-dragging] floppy-block:not(.can)>:is(svg.shape,.hd){filter:saturate(.2) brightness(.45);transition:filter .12s}
floppy-canvas[data-dragging] floppy-block.can>.mouth{min-height:30px;background:#123f3a;outline:1.5px dashed var(--ok);outline-offset:-1px}
floppy-block>.ft{height:22px}
floppy-block.sel>.hd{outline:1px dashed var(--ink);outline-offset:-3px}
floppy-block.active{z-index:2}
floppy-block>svg.hl{position:absolute;left:0;top:0;z-index:3;overflow:visible;pointer-events:none}
floppy-block>svg.hl path{stroke:var(--led)}
floppy-block[data-state="lifted"]{opacity:.4}
floppy-block[data-state="offering"]>.mouth{outline:1.5px dashed var(--ok);outline-offset:-2px}
floppy-block[data-state="refusing"]>.mouth{outline:1.5px dashed var(--bad);outline-offset:-2px}
.ins{position:absolute;left:0;right:-40px;height:2px;background:var(--ok);pointer-events:none;z-index:5}

/* run panel */
floppy-run{display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1.5px solid var(--line)}
.tabs button{flex:1;border:0;border-right:1px solid var(--mute);background:transparent;padding:8px 6px;font:600 14px var(--f-c);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink)}
.tabs b{font:600 11px var(--f-mono);padding:0 5px;margin-left:5px;color:var(--bg);background:var(--ok)}
.tabs b.bad{background:var(--bad)}
.sec{padding:12px;display:grid;gap:8px;border-bottom:1px dashed var(--dash)}
.sec h3{margin:0;font:600 13px var(--f-c);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cfg{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--mute)}
.cfg span{border:1px solid var(--line);background:var(--c-state);color:#fff;padding:2px 8px}
.cfg span.leaf{border-color:var(--led);background:var(--led);color:#061a35;font-weight:700}
.et{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1.5px solid var(--acc);background:var(--well);color:var(--ink);padding:8px 10px;font-size:12px;text-align:left;width:100%}
.et:hover{background:#12406f}
.et small{font-size:11px;color:var(--acc);white-space:nowrap}
.tm{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;border:1px dashed var(--dash);padding:6px 8px}
.tm button{border:1px solid var(--warn);color:var(--warn);background:transparent;padding:2px 8px;font-size:11px}
.inject{display:flex;gap:6px}
.inject input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--mute);background:var(--code);padding:6px 8px;font-size:12px}
.inject input::placeholder{color:var(--mute)}
.inject button,.restart{border:1px solid var(--mute);background:transparent;padding:5px 10px;font:600 13px var(--f-c);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.none{font-size:12px;color:var(--mute);margin:0;line-height:1.5}
.log{list-style:none;margin:0;padding:0;font-size:11.5px;line-height:1.6;max-height:260px;overflow-y:auto}
.log li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;color:var(--mute)}
.log li b{font-weight:400;color:var(--ink);overflow-wrap:anywhere}
.log li:first-child b{color:var(--acc);font-weight:700}
pre.src{margin:0;padding:12px;font-size:11.5px;line-height:1.55;overflow:auto;max-height:calc(100vh - 180px);background:var(--code)}
pre.src mark{background:var(--hi);color:var(--warn)}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.issues li{font-size:12px;line-height:1.45;border-left:2px solid var(--bad);padding:4px 8px;background:var(--code)}
.issues button{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;font-size:11.5px}
.loading{max-width:1200px;margin:0 auto;padding:40px 0;font:600 18px var(--f-c);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
/* Bill */
[hidden]{display:none!important}
floppy-side{display:flex;flex-direction:column}
floppy-side>floppy-palette>.ph{display:none}
floppy-bill{display:flex;flex-direction:column;min-height:0}
.bill-hd{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1.5px solid var(--line)}
.bill-hd .face{width:110px;height:128px;flex:0 0 auto;border:1px dashed var(--dash);position:relative;background:var(--well);overflow:hidden}
.bill-hd floppy-bot{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 12px);display:block}
.bill-hd b{font:700 28px/1 var(--f-c);letter-spacing:.06em;text-transform:uppercase;display:block}
.bill-hd>div>span{font-size:11.5px;color:var(--mute)}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.steps li{font:600 12px var(--f-c);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--mute);color:var(--mute);padding:1px 6px}
.steps li.done{border-color:var(--ok);color:var(--ok)}
.steps li.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chat{flex:1;overflow-y:auto;padding:12px;display:grid;gap:12px;align-content:start;max-height:calc(100vh - 330px);min-height:260px}
.msg{font-size:12.5px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.msg.bill{border-left:2px solid var(--acc);padding:2px 0 2px 10px}
.msg.you{justify-self:end;background:var(--ink);color:var(--bg);padding:6px 10px;max-width:85%}
.msg code{font-size:11.5px;color:var(--acc)}
.msg a{color:var(--acc)}
.card{margin:8px 0 4px;padding:8px 10px;border:1.5px solid var(--line);background:var(--well);list-style:none}
ol.card.plan{counter-reset:s;display:grid;gap:4px}
ol.card.plan li{counter-increment:s;display:grid;grid-template-columns:20px minmax(0,1fr)}
ol.card.plan li::before{content:counter(s);color:var(--acc);font-weight:700}
.parts{display:grid;gap:8px}
.parts li{display:grid;gap:1px}
.parts li div{display:flex;gap:8px;align-items:baseline}
.parts b{font:700 16px var(--f-c);letter-spacing:.06em;text-transform:uppercase}
.parts small{font-size:10.5px;color:var(--mute)}
.parts span{color:var(--mute);font-size:12px}
.aside{margin:6px 0 0;color:var(--mute);font-size:11.5px}
.setup{display:grid;gap:8px}
.setup fieldset{border:0;border-top:1px dashed var(--dash);margin:0;padding:6px 0 0;display:grid;gap:6px;min-width:0}
.setup legend{font:700 14px var(--f-c);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);padding:0 6px 0 0}
.setup label{display:grid;gap:2px;font-size:11px;color:var(--mute)}
.setup input{background:var(--field);border:0;border-bottom:1px solid var(--mute);padding:4px 6px;font-size:12px;min-width:0;color:var(--ink)}
.setup button,.chips button,.ask button,a.go{border:1.5px solid var(--acc);background:transparent;color:var(--ink);padding:5px 10px;font:600 14px var(--f-c);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-block;text-align:left}
.setup button,a.go{background:var(--acc);color:var(--bg);justify-self:start}
.chips button:hover{background:#12406f}
.inst{display:grid;gap:6px}
.inst li{display:grid;gap:1px}
.inst b{color:var(--ok)}
.inst span{color:var(--mute);font-size:11.5px}
.result .files{display:flex;flex-wrap:wrap;gap:6px}
.result .files span{border:1px solid var(--ink);padding:1px 6px;font-size:11.5px}
.result pre{margin:4px 0 0;padding:6px 8px;background:var(--field);font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.result p{margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.chips:empty{display:none}
.ask{display:flex;gap:6px;padding:10px 12px;border-top:1.5px solid var(--line)}
.ask input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--mute);background:var(--field);padding:6px 8px;font-size:12px}
.ask input::placeholder{color:var(--mute)}
/* spaces */
floppy-modes{display:flex;border:1.5px solid var(--line);margin-left:auto;flex-wrap:wrap}
floppy-modes button{background:transparent;border:0;border-right:1px solid var(--mute);padding:6px 14px;font:600 15px var(--f-c);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
floppy-modes button:last-child{border-right:0}
floppy-modes button[aria-current="true"]{background:var(--ink);color:var(--bg)}
floppy-workshop[data-mode] .grid>:is(floppy-bill,floppy-palette,floppy-run,floppy-observe){display:none}
floppy-workshop[data-mode="build"] .grid>floppy-bill{display:flex}
floppy-workshop[data-mode="workbench"] .grid>:is(floppy-palette,floppy-run){display:block}
floppy-workshop[data-mode="testbench"] .grid>floppy-run{display:block}
floppy-workshop[data-mode="observe"] .grid>floppy-observe{display:block}
floppy-workshop[data-mode="build"] .grid{grid-template-columns:minmax(0,760px);justify-content:center}
floppy-workshop[data-mode="build"] .grid>floppy-canvas{display:none}
floppy-workshop[data-mode="workbench"] .grid{grid-template-columns:300px minmax(0,1fr) 330px}
floppy-workshop[data-mode="testbench"] .grid{grid-template-columns:minmax(0,1fr) 360px}
floppy-workshop[data-mode="observe"] .grid{grid-template-columns:minmax(0,1fr) 400px}
floppy-workshop[data-mode="build"] .bill-hd .face{width:130px;height:150px}
.pad.ro .hd{cursor:default}
.pad.ro .hd :is(.x,select.add){display:none}
.pad.ro .hd :is(input,select){pointer-events:none;background:transparent;border-bottom-color:transparent;appearance:none}
floppy-observe .ph .dot{display:inline-block;width:9px;height:9px;border:1.5px solid var(--mute);margin-right:8px;vertical-align:1px}
floppy-observe .ph .dot.on{background:var(--ok);border-color:var(--ok)}
.pause{border:1px solid var(--acc);background:transparent;color:var(--ink);padding:2px 10px;font:600 13px var(--f-c);letter-spacing:.1em;text-transform:uppercase}
.filt{display:flex;flex-wrap:wrap;gap:4px}
.filt button{border:1px solid var(--mute);background:transparent;padding:1px 8px;font:600 13px var(--f-c);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.filt button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stream{list-style:none;margin:0;padding:0;font-size:11.5px;max-height:calc(100vh - 330px);overflow-y:auto}
.stream li{display:grid;grid-template-columns:64px 62px minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px dashed rgba(157,184,220,.25)}
.stream time{color:var(--mute)}
.stream em{font:600 12px var(--f-c);letter-spacing:.08em;text-transform:uppercase}
.stream b{font-weight:400;overflow-wrap:anywhere}
.stream .in em{color:var(--acc)} .stream .out em{color:var(--warn)} .stream .state em{color:#c9b6ff} .stream .service em{color:var(--ok)} .stream .note em{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

   from(HTMLElement) gives a custom element the Instance protocol,

---------------------------------------------------------------- */
const hsm = (() => {

    class HostElement extends Base {}
    for (const [k, d] of Object.entries(Object.getOwnPropertyDescriptors(lib.Instance.prototype))) {

    }

  function start(instance, model) {
    if (instance[BIND]) return instance;
    const s = lib.start(instance, model);
    s[BIND] = true;
    return s;
  }
  const event = (name, data) => ({ name, kind: lib.Kinds.Event, data });
  const live = (host, name, data) => { try { void Promise.resolve(host.dispatch(event(name, data))).catch(e => console.error(e)); } catch (e) { console.error(e); } };
  return { ...lib, from, start, event, live };

/* Every element spec by qualified tag: {attrs, kids:Set, any, ns}. */
const SPECS = new Map();
for (const [n, s] of Object.entries(CATALOG.scxml)) {
  SPECS.set(n, { tag: n, ns: "", attrs: s.attrs, kids: new Set(s.children.filter(c => c !== "##other")), any: s.children.includes("##other"), text: s.text });
}
for (const [p, ns] of Object.entries(CATALOG.ext)) {
  for (const [n, s] of Object.entries(ns.elements)) {
    SPECS.set(p + ":" + n, { tag: p + ":" + n, ns: p, attrs: s.attrs, kids: new Set(s.children.filter(c => c !== "##other").map(c => p + ":" + c)), any: false, nested: s.nested, text: s.text });

/* ---------------------------------------------------------------
   Notches from the XSD. Parents whose content models overlap form
   one mouth family; a child's notch is the family of the mouths
   that take it. A block fits where the XSD allows it AND its notch
   matches the mouth's.
---------------------------------------------------------------- */
const FAM = (() => {
  const parents = [...SPECS.values()].filter(s => s.kids.size).sort((a, b) => b.kids.size - a.kids.size);
  const clusters = [];
  const mouth = new Map();
  for (const s of parents) {
    let c = clusters.find(c => [...s.kids].filter(k => c.kids.has(k)).length / Math.min(s.kids.size, c.kids.size) >= 0.5);
    if (!c) { c = { parents: [], kids: new Set() }; clusters.push(c); }
    c.parents.push(s.tag); s.kids.forEach(k => c.kids.add(k)); mouth.set(s.tag, c);
  }
  const named = c => c.parents.includes("state") ? "structure" : c.parents.includes("onentry") ? "executable content" : c.parents.includes("invoke") ? "parameters" : c.parents.includes("datamodel") ? "data" : c.parents[0] + " content";
  const SHAPES = ["square", "trap", "round", "tri", "double", "wave"];
  const order = c => { const i = ["structure", "executable content", "parameters", "data"].indexOf(named(c)); return i < 0 ? 99 : i; };
  clusters.sort((a, b) => order(a) - order(b));
  clusters.forEach((c, i) => { c.name = named(c); c.shape = SHAPES[i % SHAPES.length]; c.members = []; });
  const family = new Map();
  for (const tag of SPECS.keys()) {
    let best = null, n = 0;
    for (const c of clusters) {
      const k = c.parents.filter(p => SPECS.get(p).kids.has(tag)).length;
      if (k > n) { best = c; n = k; }
    }
    /* Extension elements arrive through scxml.extra.content (xsd:any ##other);
       scxml.rs runs them as executable content. */
    if (!best && SPECS.get(tag).ns && !SPECS.get(tag).nested) best = mouth.get("onentry");
    if (best) { family.set(tag, best); best.members.push(tag); }
  }
  return { clusters, mouth, family };
})();

/* XSD check: required attributes, fixed values, IDREFs, content models. */
function check(root) {
  const ids = new Set(stateIds(root)), out = [];
  walk(root, (n, p) => {
    const spec = SPECS.get(n.tag);
    spec.attrs.filter(a => a.use === "required" && !n.attrs[a.name]).forEach(a => out.push({ id: n.id, msg: `${nm(n.tag)} needs ${a.name}` }));
    spec.attrs.filter(a => a.fixed && n.attrs[a.name] && n.attrs[a.name] !== a.fixed).forEach(a => out.push({ id: n.id, msg: `${nm(n.tag)} ${a.name} must be ${a.fixed}` }));
    ["target", "initial"].forEach(k => (n.attrs[k] || "").split(/\s+/).filter(Boolean).forEach(t => { if (!ids.has(t) && !(n.tag === "send" && k === "target")) out.push({ id: n.id, msg: `${nm(n.tag)} ${k} "${t}" names no state` }); }));
    if (p && !xsdAllows(p.tag, n.tag)) out.push({ id: n.id, msg: `${nm(n.tag)} doesn't go inside ${nm(p.tag)}` });
  });
  return out;
}

/* Serialize to SCXML. */
function toSCXML(root, activeIds) {
  const prefixes = new Set();
  walk(root, n => { if (n.tag.includes(":")) prefixes.add(n.tag.split(":")[0]); Object.keys(n.attrs).forEach(k => k.includes(":") && prefixes.add(k.split(":")[0])); });
  const uri = p => p === "env" ? ENV_NS : CATALOG.ext[p]?.uri;
  const lines = [];
  const attrs = n => Object.entries(n.attrs).map(([k, v]) => ` ${k}=${v.includes('"') ? `'${v}'` : `"${v}"`}`).join("");
  const emit = (n, depth) => {
    const pad = "  ".repeat(depth);
    let open = `<${n.tag}`;
    if (n.tag === "scxml") open += ` xmlns="${SCXML_NS}"` + [...prefixes].map(p => `\n${pad}       xmlns:${p}="${uri(p)}"`).join("");
    open += attrs(n);
    const hot = activeIds.has(n.id);
    const L = s => lines.push({ s: pad + s, hot });
    if (!n.kids.length) { L(open + "/>"); return; }
    L(open + ">"); n.kids.forEach(k => emit(k, depth + 1)); L(`</${n.tag}>`);
  };
  emit(root, 0);
  return lines.map(l => l.hot ? `<mark>${esc(l.s)}</mark>` : esc(l.s)).join("\n");
}

  }
}
