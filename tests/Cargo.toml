[package]
name = "floppy-tests"
description = "floppy's integration tests: its bots, namespaces, and services run on scxml.rs through `scx run`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dev-dependencies]
# Model-facing XML prompts (decision D201) are read back with the renderer
# that writes them.
floppy-cognition = { path = "../namespaces/cognition" }
quick-xml.workspace = true
# The generate package validator's fixes are applied with the `scx`
# namespace's fix pass to the canonical report `scx validate` writes.
scx.workspace = true
scxml-reporting.workspace = true
# The builder's inline `event:schema` attributes are compared with its
# schema files through the scxml.rs XML parser.
scxml-event-schema.workspace = true
scxml-syntax.workspace = true
# The live decision checks the chosen event's data against its schema.
scxml-types.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
