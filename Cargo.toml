[workspace]
members = [
    "tests",
    "namespaces/decision",
    "namespaces/conversation",
    "namespaces/migration",
    "namespaces/device",
    "namespaces/processing",
    "namespaces/intuition",
    "namespaces/cognition",
    "namespaces/identity",
    "namespaces/memory",
    "namespaces/behavior",
    "namespaces/autonomy",
    "services/generate",
    "services/generate/validator",
    "services/decision",
    "services/sql",
    "services/files",
    "services/speech",
    "services/pgsql",
    "tests/spikes/pglite",
]
# scxml.rs is a squashed subtree with its own workspace, lockfile, and proof
# matrix; floppy depends on its crates by path and never absorbs it.
exclude = ["scxml.rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
authors = ["Stateforward contributors"]
repository = "https://github.com/stateforward/floppy"
homepage = "https://github.com/stateforward/floppy"
readme = "README.md"
# Nothing is published to crates.io; floppy ships as source plus the Wasm
# components built from this workspace.
publish = false

[workspace.dependencies]
# The same pins as scxml.rs's workspace (scxml.rs/Cargo.toml); Cargo.lock was
# seeded from scxml.rs/Cargo.lock so shared dependencies resolve identically.
# The JSON Schema validator scxml-event-schema compiles with (the same pin):
# the generate service reads where a call's arguments first fail its tool's
# parameters, which `CompiledSchema::admits` does not report.
boon = { version = "=0.6.1", default-features = false }
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
# The XML parser of scxml.rs's syntax crate, the same pin: the behavior
# namespace reads a draft's sends with it.
quick-xml = { version = "0.41.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
# wit-bindgen generated ABI glue of the namespace components (the same pin as
# scxml.rs's components).
wit-bindgen = { version = "0.51.0", default-features = false, features = ["macros", "realloc"] }
# SQLite for the sql service (floppy only; scxml.rs has no SQLite):
# `bundled` compiles the amalgamation into the component; `hooks` for the
# authorizer that keeps a document's statements inside their transaction.
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled", "hooks"] }

scxml-compiler-core = { path = "scxml.rs/crates/scxml-compiler-core" }
scxml-event-schema = { path = "scxml.rs/crates/scxml-event-schema" }
scxml-host-wasmtime = { path = "scxml.rs/hosts/scxml-host-wasmtime" }
scxml-reporting = { path = "scxml.rs/crates/scxml-reporting" }
# The `scx` namespace's fix pass (`apply_machine_applicable`), which the
# package validator test applies.
scx = { path = "scxml.rs/namespaces/scx" }
scxml-syntax = { path = "scxml.rs/crates/scxml-syntax" }
scxml-types = { path = "scxml.rs/crates/scxml-types" }
scxml-validator-core = { path = "scxml.rs/crates/scxml-validator-core" }
scxml-validator-xsd = { path = "scxml.rs/crates/scxml-validator-xsd" }

[workspace.lints.rust]
# `deny` rather than `forbid` so the namespace component crates can inherit
# these lints once they link wit-bindgen glue (as scxml.rs's components do);
# every crate root still carries `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
incremental = true

# Dependencies (Wasmtime and Cranelift above all) are optimized in debug and
# test builds, as in scxml.rs: the host tests compile and run components
# through them.
[profile.dev.package."*"]
debug = 0
opt-level = 3

[profile.test]
debug = 1
incremental = true

[profile.test.package."*"]
debug = 0
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
