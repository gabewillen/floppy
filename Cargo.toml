[workspace.lints.rust]
# `deny` rather than `forbid` so the component crates can inherit these lints:
# on wasm32 they `allow(unsafe_code)` at the crate root solely for
# wit-bindgen generated ABI glue (authored unsafe there is rejected by
# scripts/verify-component-authored-unsafe.py). Every crate root still carries
# `#![forbid(unsafe_code)]` (components: on every non-wasm32 target), which no
# inner attribute can relax.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
incremental = true

# Dependencies (Wasmtime and Cranelift above all) are optimized in debug and
# test builds: the host tests compile and run every component through them,
# which unoptimized takes hours on a 4-core CI runner. Workspace crates stay
# unoptimized, with debug assertions, overflow checks, and debug-sized stack
# frames.
[profile.dev.package."*"]
debug = 0
opt-level = 3

[profile.test]
debug = 1
incremental = true

[profile.test.package."*"]
debug = 0
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
